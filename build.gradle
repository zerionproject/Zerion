import org.gradle.api.artifacts.component.ModuleComponentIdentifier
import org.gradle.api.artifacts.component.ProjectComponentSelector

Configuration ideModelCopyOf(Project owner, Configuration configuration) {
	Configuration copy = configuration.copyRecursive()
	copy.canBeConsumed = false
	copy.resolutionStrategy.dependencySubstitution.all { substitution ->
		if (!(substitution.requested instanceof ProjectComponentSelector)) {
			substitution.useTarget(owner)
		}
	}
	return copy
}

allprojects {
	repositories {
		mavenCentral()
		google()
	}
	plugins.withType(JavaBasePlugin) {
		java {
			toolchain {
				languageVersion = JavaLanguageVersion.of(21)
			}
		}
	}
	afterEvaluate {
		tasks.withType(Test) {
			outputs.upToDateWhen { System.getenv("OPTIONAL_TESTS") == null }
			systemProperty 'java.security.egd', System.getProperty('java.security.egd')
		}
	}
	dependencyLocking {
		lockAllConfigurations()
		lockMode = LockMode.STRICT
	}
	tasks.register('verifyLockedConfigurationCopies') {
		notCompatibleWithConfigurationCache('resolves copies of configurations at execution time')
		doLast {
			configurations.matching {
				it.canBeResolved && (it.name.endsWith('RuntimeClasspath')
						|| it.name.endsWith('CompileClasspath'))
			}.each { c ->
				if (!c.resolutionStrategy.dependencyLockingEnabled) {
					throw new GradleException("dependency locking is not active on ${c.name}")
				}
				ideModelCopyOf(project, c).incoming.resolutionResult.allComponents { }
			}
		}
	}
	tasks.matching { it.name == 'check' }.configureEach {
		it.dependsOn('verifyLockedConfigurationCopies')
	}
	tasks.register('writeIdeCopyLockState') {
		notCompatibleWithConfigurationCache('resolves copies of configurations at execution time')
		doLast {
			if (gradle.startParameter.writeDependencyLocks) {
				throw new GradleException('run writeIdeCopyLockState without --write-locks, after resolveAndLockAll --write-locks')
			}
			File lockFile = file('gradle.lockfile')
			if (!lockFile.isFile()) return
			List<String> header = []
			Map<String, Set<String>> modules = new TreeMap<>()
			Set<String> empty = new TreeSet<>()
			boolean hadEmptyLine = false
			lockFile.readLines().each { line ->
				if (line.startsWith('#')) {
					header << line
					return
				}
				if (line.trim().isEmpty()) return
				int eq = line.indexOf('=')
				String key = line.substring(0, eq)
				Set<String> names = new TreeSet<>(line.substring(eq + 1).split(',').findAll { it })
				if (key == 'empty') {
					hadEmptyLine = true
					empty.addAll(names)
				} else {
					modules.put(key, names)
				}
			}
			configurations.findAll { it.canBeResolved }.each { c ->
				String copyName = c.name + 'Copy'
				modules.values().each { it.remove(copyName) }
				empty.remove(copyName)
				Set<String> resolved = new TreeSet<>()
				try {
					Configuration copy = ideModelCopyOf(project, c)
					copy.resolutionStrategy.deactivateDependencyLocking()
					copy.incoming.resolutionResult.allComponents { component ->
						def id = component.id
						if (id instanceof ModuleComponentIdentifier) {
							resolved << "${id.group}:${id.module}:${id.version}".toString()
						}
					}
				} catch (Exception ignored) {
					return
				}
				if (resolved.isEmpty()) {
					empty << copyName
				} else {
					resolved.each { modules.computeIfAbsent(it) { new TreeSet<>() } << copyName }
				}
			}
			List<String> out = new ArrayList<>(header)
			modules.each { module, names ->
				if (!names.isEmpty()) out << "${module}=${names.join(',')}".toString()
			}
			if (hadEmptyLine || !empty.isEmpty()) out << "empty=${empty.join(',')}".toString()
			lockFile.text = out.join('\n') + '\n'
		}
	}
	tasks.register('resolveAndLockAll') {
		notCompatibleWithConfigurationCache('resolves every configuration at execution time')
		doFirst {
			assert gradle.startParameter.writeDependencyLocks ||
					!gradle.startParameter.lockedDependenciesToUpdate.isEmpty()
		}
		doLast {
			configurations.findAll { it.canBeResolved }.each { c ->
				try {
					c.resolve()
				} catch (Exception ignored) {
				}
			}
		}
	}
}

buildscript {
	repositories {
		google()
		maven {
			url 'https://plugins.gradle.org/m2/'
		}
	}

	ext {
		kotlin_version = '1.9.25'
		dagger_version = "2.51.1"
		okhttp_version = "4.12.0"
		jackson_version = "2.15.3"
		tor_version = "0.4.9.13"
		lyrebird_version = "0.6.2"
		jsoup_version = '1.18.3'
		bouncy_castle_version = '1.84'
		junit_version = "4.13.2"
		jmock_version = '2.12.0'
		mockwebserver_version = '4.10.0'
		jtorctl_version = '0.5'
	}
	configurations.classpath {
		resolutionStrategy.activateDependencyLocking()
	}
	dependencies {
		classpath 'com.android.tools.build:gradle:8.13.0'
		classpath 'ru.vyarus:gradle-animalsniffer-plugin:2.0.1'
		classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
		classpath 'com.gradleup.shadow:shadow-gradle-plugin:8.3.6'
	}
}

