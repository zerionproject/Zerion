# Zerion CI/CD Configuration
# Customize this for your CI infrastructure

image: openjdk:17-slim

stages:
  - build
  - test

variables:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"

.base-job:
  before_script:
    - export GRADLE_USER_HOME=$PWD/.gradle
  cache:
    key: "$CI_COMMIT_REF_SLUG"
    paths:
      - .gradle/wrapper
      - .gradle/caches

build:
  extends: .base-job
  stage: build
  script:
    - ./gradlew assembleOfficialRelease -x test -x lint
  artifacts:
    paths:
      - zerion-android/build/outputs/apk/official/release/

test:
  extends: .base-job
  stage: test
  script:
    - ./gradlew test -x lint
  allow_failure: true
