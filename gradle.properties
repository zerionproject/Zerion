noWitness=androidApis,_internal_aapt2_binary
org.gradle.jvmargs=-Xmx2g
android.useAndroidX=true
android.enableJetifier=true
android.suppressUnsupportedCompileSdk=35,34

# F-Droid reproducible build - use static BuildConfig values
fdroid=true

# Disable baseline profile generation for reproducible builds
android.experimental.enableStartupProfiles=false
android.experimental.r8.dexStartupOptimization=false
android.enableBaselineProfile=false
