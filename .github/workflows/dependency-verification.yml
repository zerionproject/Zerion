name: Dependency verification

on:
  push:
    branches:
      - master
      - dev
    tags:
      - "v*"
    paths:
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - "gradle.properties"
      - "**/build.gradle"
      - "**/*.lockfile"
      - "settings.gradle"
      - "packaging/**"
      - "scripts/**"
      - "zerion-android/native/**"
      - "zerion-core-android/src/main/resources/org/zerionproject/tor/**"
      - ".github/workflows/dependency-verification.yml"
  pull_request:
    paths:
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - "gradle.properties"
      - "**/build.gradle"
      - "**/*.lockfile"
      - "settings.gradle"
      - "packaging/**"
      - "scripts/**"
      - "zerion-android/native/**"
      - "zerion-core-android/src/main/resources/org/zerionproject/tor/**"
  schedule:
    - cron: "41 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  strict-from-clean-cache:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned by tag until each tag's commit has been checked
      # against the upstream repository; docs/SUPPLY_CHAIN.md lists the
      # commands that turn a tag into a commit pin.
      - uses: actions/checkout@v4
      - name: Verify the Gradle wrapper before it runs
        run: bash scripts/check-wrapper.sh
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Resolve every compile, test and release runtime classpath with strict verification and no dependency cache
        run: |
          export GRADLE_USER_HOME="$RUNNER_TEMP/gradle-home-clean"
          rm -rf "$GRADLE_USER_HOME"
          chmod +x gradlew
          ./gradlew --no-daemon --dependency-verification strict \
            testClasses \
            :zerion-android:compileOfficialReleaseJavaWithJavac \
            :zerion-android:compileOfficialDebugJavaWithJavac \
            :zerion-android:dependencies --configuration officialReleaseRuntimeClasspath
      - name: Native build recipes parse and the pin files are well formed
        run: |
          bash -n packaging/tor-android/build-tor-android.sh
          bash -n packaging/tor-android/fdroid-build.sh
          bash -n packaging/monero-android/build-monero-android.sh
          bash -n packaging/monero-android/fdroid-build.sh
          bash -n scripts/build-fdroid-apk.sh
          bash -n scripts/sign-release.sh
          for f in zerion-core-android/src/main/resources/org/zerionproject/tor/binaries.sha256 \
                   zerion-android/native/thirdparty/thirdparty-native.sha256; do
            if grep -v '^#' "$f" | grep -v '^$' | grep -q -v -E '^[A-Za-z0-9_./-]+ [0-9a-f]{64}$'; then
              echo "malformed pin in $f"; exit 1
            fi
          done
          echo "pin files well formed"
      - name: Reject a tampered artifact
        run: |
          export GRADLE_USER_HOME="$RUNNER_TEMP/gradle-home-clean"
          f=$(find "$GRADLE_USER_HOME/caches/modules-2/files-2.1/org.bouncycastle/bcprov-jdk15to18" -name "bcprov-jdk15to18-*.jar" | head -1)
          test -n "$f"
          printf 'x' >> "$f"
          if ./gradlew --no-daemon --dependency-verification strict --offline :zerion-core:compileJava > tamper.log 2>&1; then
            echo "strict verification accepted a modified artifact"; exit 1
          fi
          grep -q "Dependency verification failed" tamper.log
