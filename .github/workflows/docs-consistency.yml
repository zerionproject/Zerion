name: Documentation consistency

on:
  push:
    paths:
      - "README.md"
      - "SECURITY.md"
      - "CONTRIBUTING.md"
      - "docs/**"
      - "fastlane/**"
      - "scripts/check-docs.py"
      - "scripts/check-version.py"
      - "scripts/render-release-refs.py"
      - "zerion-android/build.gradle"
      - ".github/workflows/docs-consistency.yml"
  pull_request:
    paths:
      - "README.md"
      - "SECURITY.md"
      - "CONTRIBUTING.md"
      - "docs/**"
      - "fastlane/**"
      - "scripts/check-docs.py"
      - "scripts/check-version.py"
      - "scripts/render-release-refs.py"
      - "zerion-android/build.gradle"
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Version and release references agree with the manifest
        run: python3 scripts/check-version.py
      - name: Check documents against the release manifest, the crypto list and the live website
        run: python3 scripts/check-docs.py
      - name: Verify the published APK hash against the manifest
        run: |
          python3 - <<'EOF'
          import json, hashlib, urllib.request
          m = json.load(open("docs/release-manifest.json"))["android"]["apk"]
          data = urllib.request.urlopen(m["url"], timeout=300).read()
          h = hashlib.sha256(data).hexdigest()
          assert len(data) == m["sizeBytes"], "size differs: %d" % len(data)
          assert h == m["sha256"], "hash differs: %s" % h
          print("published APK matches the manifest")
          EOF
