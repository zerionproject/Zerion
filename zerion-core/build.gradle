apply plugin: 'java-library'
sourceCompatibility = 17
targetCompatibility = 17

apply plugin: 'ru.vyarus.animalsniffer'
apply plugin: 'idea'
apply from: '../dagger.gradle'

dependencies {
	api project(':zerion-core-api')
	api project(':zerion-wire')

	api "org.briarproject:jtorctl:$jtorctl_version"

	implementation "org.bouncycastle:bcprov-jdk15to18:$bouncy_castle_version"
	implementation 'org.bitlet:weupnp:0.1.4'
	implementation 'org.whispersystems:curve25519-java:0.5.0'
	implementation 'org.briarproject:socks-socket:0.1'
	implementation "com.squareup.okhttp3:okhttp:$okhttp_version"
	implementation "com.fasterxml.jackson.core:jackson-databind:$jackson_version"

	annotationProcessor "com.google.dagger:dagger-compiler:$dagger_version"

	testImplementation project(path: ':zerion-core-api', configuration: 'testOutput')

	testImplementation 'org.hsqldb:hsqldb:2.3.5'
	testImplementation 'net.i2p.crypto:eddsa:0.2.0'
	testImplementation 'net.jodah:concurrentunit:0.4.6'
	testImplementation "junit:junit:$junit_version"
	testImplementation "org.jmock:jmock:$jmock_version"
	testImplementation "org.jmock:jmock-junit4:$jmock_version"
	testImplementation "org.jmock:jmock-imposters:$jmock_version"
	testImplementation "com.squareup.okhttp3:mockwebserver:$mockwebserver_version"

	testAnnotationProcessor "com.google.dagger:dagger-compiler:$dagger_version"

	signature 'org.codehaus.mojo.signature:java16:1.1@signature'
}

animalsniffer {
	ignore 'java.util.Objects'
}

configurations {
	testOutput.extendsFrom(testCompile)
}
task jarTest(type: Jar, dependsOn: testClasses) {
	from sourceSets.test.output, sourceSets.main.output
	archiveClassifier = 'test'
}
artifacts {
	testOutput jarTest
}
