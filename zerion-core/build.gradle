apply plugin: 'java-library'
sourceCompatibility = 17
targetCompatibility = 17

apply plugin: 'ru.vyarus.animalsniffer'
apply plugin: 'idea'
apply from: '../dagger.gradle'

dependencies {
	api project(':zerion-core-api')
	api project(':zerion-wire')

	api "org.briarproject:jtorctl:$jtorctl_version"

	implementation "org.bouncycastle:bcprov-jdk15to18:$bouncy_castle_version"
	implementation 'org.whispersystems:curve25519-java:0.5.0'
	implementation "com.squareup.okhttp3:okhttp:$okhttp_version"

	annotationProcessor "com.google.dagger:dagger-compiler:$dagger_version"

	testImplementation project(path: ':zerion-core-api', configuration: 'testOutput')

	testImplementation 'org.hsqldb:hsqldb:2.3.5'
	testImplementation 'net.i2p.crypto:eddsa:0.2.0'
	testImplementation 'net.jodah:concurrentunit:0.4.6'
	testImplementation "junit:junit:$junit_version"
	testImplementation "org.jmock:jmock:$jmock_version"
	testImplementation "org.jmock:jmock-junit4:$jmock_version"
	testImplementation "org.jmock:jmock-imposters:$jmock_version"
	testImplementation "com.squareup.okhttp3:mockwebserver:$mockwebserver_version"

	testAnnotationProcessor "com.google.dagger:dagger-compiler:$dagger_version"

	signature 'org.codehaus.mojo.signature:java16:1.1@signature'
}

animalsniffer {
	ignore 'java.util.Objects'
}

configurations {
	testOutput.extendsFrom(testCompile)
}
task jarTest(type: Jar, dependsOn: testClasses) {
	from sourceSets.test.output, sourceSets.main.output
	archiveClassifier = 'test'
}
artifacts {
	testOutput jarTest
}

def toolsSource = file('src/tools/java')
def toolsClasses = layout.buildDirectory.dir('classes/java/tools')
def toolsOutput = files(toolsClasses).builtBy('compileToolsJava')

tasks.register('compileToolsJava', JavaCompile) {
	description = 'Compiles the developer tools in src/tools/java against the main classes; they are not part of any shipped artefact'
	source = fileTree(toolsSource)
	classpath = sourceSets.main.output + sourceSets.main.compileClasspath
	destinationDirectory = toolsClasses
	options.annotationProcessorPath = files()
	options.encoding = 'UTF-8'
}

sourceSets.test.compileClasspath += toolsOutput
sourceSets.test.runtimeClasspath += toolsOutput

tasks.register('simulateTranscript', JavaExec) {
	group = 'tools'
	description = 'Forges one-to-one frames, a mesh envelope or pairing values under a key both peers hold and checks them with the production code; pass the scenario with --args'
	classpath = toolsOutput + sourceSets.main.runtimeClasspath
	mainClass = 'org.zerionproject.tools.TranscriptSimulator'
}

def simulatorJar = tasks.register('transcriptSimulatorJar', Jar) {
	group = 'tools'
	description = 'Builds one runnable jar of the transcript simulator with the classes it needs inside; run it with java -jar; it is not part of any shipped artefact'
	archiveBaseName = 'zerion-transcript-simulator'
	archiveAppendix = ''
	archiveVersion = ''
	archiveClassifier = ''
	destinationDirectory = layout.buildDirectory.dir('tools')
	manifest {
		attributes 'Main-Class': 'org.zerionproject.tools.TranscriptSimulator'
	}
	from toolsOutput
	from {
		sourceSets.main.runtimeClasspath.findAll { it.exists() }.collect {
			it.isDirectory() ? it : zipTree(it)
		}
	}
	exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA',
			'META-INF/*.EC', 'META-INF/INDEX.LIST', 'META-INF/versions/**',
			'module-info.class'
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
	preserveFileTimestamps = false
	reproducibleFileOrder = true
}

tasks.register('checkTranscriptSimulatorJar') {
	group = 'tools'
	description = 'Runs the transcript simulator jar on its own, without a class path: it must list its scenarios and verify one forged record of each'
	dependsOn simulatorJar
	doLast {
		def jar = simulatorJar.get().archiveFile.get().asFile
		def java = new File(System.getProperty('java.home'), 'bin/java')
		def start = { List<String> arguments ->
			def process = new ProcessBuilder(
					[java.path, '-jar', jar.path] + arguments)
					.directory(temporaryDir)
					.redirectErrorStream(true)
					.start()
			process.outputStream.close()
			def output = process.inputStream.getText('UTF-8')
			[process.waitFor(), output]
		}
		def (listCode, list) = start([])
		['one-to-one', 'mesh', 'pairing'].each { scenario ->
			if (!list.readLines().any { it.startsWith(scenario + ' ') }) {
				throw new GradleException(
						"the jar did not list the scenario ${scenario}:\n${list}")
			}
		}
		if (listCode != 2) {
			throw new GradleException(
					"the jar ended with ${listCode} after listing its scenarios")
		}
		[['one-to-one', '--verify', 'a:Hello', 'b:Hello'],
				['mesh', '--verify', 'Hello'],
				['pairing', '--verify']].each { arguments ->
			def (code, output) = start(arguments)
			if (code != 0 || !output.contains(': OK')) {
				throw new GradleException(
						"the jar failed ${arguments} with ${code}:\n${output}")
			}
		}
	}
}
