apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

// Load keystore properties for signing (skip for F-Droid builds)
// Supports environment variables (ZERION_STORE_FILE, ZERION_STORE_PASSWORD,
// ZERION_KEY_ALIAS, ZERION_KEY_PASSWORD) or keystore.properties file.
// Environment variables take precedence over the properties file.
def isFdroidBuild = project.hasProperty('fdroid')
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (!isFdroidBuild) {
    if (System.getenv('ZERION_STORE_FILE')) {
        keystoreProperties['storeFile'] = System.getenv('ZERION_STORE_FILE')
        keystoreProperties['storePassword'] = System.getenv('ZERION_STORE_PASSWORD')
        keystoreProperties['keyAlias'] = System.getenv('ZERION_KEY_ALIAS')
        keystoreProperties['keyPassword'] = System.getenv('ZERION_KEY_PASSWORD')
    } else if (keystorePropertiesFile.exists()) {
        keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
    }
}

def getStdout = { command, defaultValue ->
    def stdout = new ByteArrayOutputStream()
    try {
        exec {
            commandLine = command
            standardOutput = stdout
        }
        return stdout.toString().trim()
    } catch (Exception ignored) {
        return defaultValue
    }
}

android {
    compileSdk 36
    buildToolsVersion '36.0.0'
    ndkVersion '27.1.12297006'
    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }
    packaging {
        jniLibs {
            useLegacyPackaging = true
            keepDebugSymbols += ['**/*.so']
            // Payjoin is build-gated OFF (PayjoinFeature.PRODUCTION_ENABLED = false,
            // no runtime override) and no production code loads its native library,
            // so the Rust libpayjoin_ffi.so is dormant attack surface and dead weight
            // in the shipped APK. Exclude it from packaging until a variant actually
            // enables the feature; the UniFFI bindings still compile, and the .so
            // stays in src/main/jniLibs so re-enabling is a one-line change here.
            excludes += ['**/libpayjoin_ffi.so']
        }
        // Always strip the embedded VCS info so the release APK stays byte-reproducible
        // regardless of which commit it was built from (removes F-Droid repro commit-fragility).
        resources {
            excludes += ["META-INF/version-control-info.textproto"]
        }
        if (isFdroidBuild) {
            resources {
                excludes += [
                    "assets/dexopt/baseline.prof",
                    "assets/dexopt/baseline.profm"
                ]
            }
        }
    }

    buildFeatures {
        buildConfig = true
    }

    // Disable Google dependency metadata for F-Droid reproducible builds
    dependenciesInfo {
        includeInApk = false
        includeInBundle = false
    }

    // Signing configuration for release builds (skipped for F-Droid builds)
    signingConfigs {
        release {
            enableV1Signing false
            enableV2Signing true
            enableV3Signing true
            if (!isFdroidBuild && keystorePropertiesFile.exists()) {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    defaultConfig {
        minSdkVersion 29
        targetSdkVersion 36
        versionCode 30400
        versionName "3.0.4"
        applicationId "com.professor.zerion"
        buildConfigField "String", "TorVersion", "\"$tor_version\""

        buildConfigField "boolean", "B3_PROOF_ENABLED", "true"
        buildConfigField "boolean", "B4_ROTATION_ENABLED", "true"

        vectorDrawables.useSupportLibrary = true

        // For reproducible builds (F-Droid): use -Pfdroid flag to disable dynamic values
        // Usage: ./gradlew assembleRelease -Pfdroid
        def isFdroid = project.hasProperty('fdroid')
        if (isFdroid) {
            // Static values for reproducible F-Droid builds
            buildConfigField "String", "GitHash", "\"release\""
            buildConfigField "Long", "BuildTimestamp", "0L"
        } else {
            // Dynamic values for development builds
            buildConfigField "String", "GitHash",
                "\"${getStdout(['git', 'rev-parse', '--short=7', 'HEAD'], 'No commit hash')}\""
            def now = (long) (System.currentTimeMillis() / 1000)
            buildConfigField "Long", "BuildTimestamp",
                "${getStdout(['git', 'log', '-n', '1', '--format=%ct'], now)}000L"
        }
        testInstrumentationRunner 'com.professor.zerion.android.BriarTestRunner'
        testInstrumentationRunnerArguments disableAnalytics: 'true'
        multiDexEnabled true
        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=none'
                abiFilters 'arm64-v8a', 'armeabi-v7a'
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            shrinkResources false
            minifyEnabled false
            crunchPngs false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.txt'
            testProguardFiles getDefaultProguardFile('proguard-android.txt'),
                    'proguard-rules.txt', 'proguard-test.txt'
        }
        release {
            shrinkResources true
            minifyEnabled true
            crunchPngs false
            // Do not embed git VCS info in the release APK. The packaging
            // resources exclude above does not catch it (AGP adds it as app
            // metadata, not a merged resource), so a worktree build (no git
            // found) and a clean-clone build differed in META-INF/
            // version-control-info.textproto and broke F-Droid reproducibility.
            // Disabling it here removes the file entirely, so the release APK is
            // reproducible regardless of the build environment's git state.
            vcsInfo {
                include false
            }
            ndk {
                abiFilters 'arm64-v8a', 'armeabi-v7a'
            }
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.txt'
            // Only use signing config for non-F-Droid builds (F-Droid signs with their own key)
            if (!isFdroidBuild) {
                signingConfig signingConfigs.release
            }
        }
    }

    flavorDimensions "version"
    productFlavors {
        screenshot {
            dimension "version"
            applicationIdSuffix ".screenshot" // = org.zerionproject.app.android.screenshot.debug
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.txt', 'proguard-test.txt'
        }
        official {
            dimension "version"
        }
    }

    variantFilter { variant ->
        if (variant.flavors*.name.contains("screenshot") && variant.buildType.name == "release") {
            setIgnore(true)
        }
    }

    compileOptions {
        // Use Java 11 to avoid D8 warnings about class file version >= 56
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main.kotlin.srcDirs += "$projectDir/native/payjoin/bindings"
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
            all {
                // Mockito 5.1.1 bundles Byte Buddy 1.12.22, which rejects Java 21
                // (class file major 65) bytecode when instrumenting a mock's type
                // hierarchy on the JDK 21 test runtime. Enable Byte Buddy's
                // experimental support so it can instrument the newer class files.
                it.systemProperty 'net.bytebuddy.experimental', 'true'
                // Robolectric has no AndroidKeyStore shadow, so activity tests
                // register an in-memory test keystore provider. Marking it JCE
                // verified needs reflective access into java.base/javax.crypto.
                it.jvmArgs '--add-opens=java.base/javax.crypto=ALL-UNNAMED'
            }
        }
    }
    namespace 'com.professor.zerion'
    lint {
        abortOnError false
        checkReleaseBuilds false
        warning 'MissingTranslation', 'MissingDefaultResource', 'ImpliedQuantity', 'ExtraTranslation', 'InvalidPackage', 'MissingPermission'
    }

    applicationVariants.all { variant ->
        variant.outputs.all {
            // Rename APK from zerion-android-official-debug to zerion-official-debug
            def appName = "zerion"
            def buildType = variant.buildType.name
            def flavorName = variant.flavorName
            outputFileName = "${appName}-${flavorName}-${buildType}.apk"
        }
    }
}

// Exclude profileinstaller to prevent non-deterministic baseline profiles (F-Droid reproducibility)
if (isFdroidBuild) {
    configurations.all {
        exclude group: 'androidx.profileinstaller', module: 'profileinstaller'
    }
}

// Pin slf4j-api to the version already used and verified, so bitcoinj's
// transitive slf4j-api does not pull a different version into the graph.
// Exclude the legacy bcprov-jdk15on packaging so only the app's
// bcprov-jdk15to18 provides the org.bouncycastle classes (bitcoinj needs the
// app's Bouncy Castle, not a duplicate on the test classpath).
configurations.all {
    resolutionStrategy {
        force 'org.slf4j:slf4j-api:1.7.32'
    }
    exclude group: 'org.bouncycastle', module: 'bcprov-jdk15on'
}

// Robolectric 4.8.2 bundles ASM 9.2 (max Java 18 bytecode). The unit-test task runs on
// JDK 21, so instrumentation reads major-version-65 core classes and ASM 9.2 aborts with
// "Unsupported class file major version 65". Force ASM 9.6 on the unit-test classpaths so
// the sandbox class loader can parse JDK 21 bytecode.
configurations.configureEach { config ->
    if (config.name.toLowerCase().contains('unittest')) {
        config.resolutionStrategy {
            force 'org.ow2.asm:asm:9.6'
            force 'org.ow2.asm:asm-commons:9.6'
            force 'org.ow2.asm:asm-tree:9.6'
            force 'org.ow2.asm:asm-util:9.6'
            force 'org.ow2.asm:asm-analysis:9.6'
        }
    }
}


dependencies {
    //
    implementation project(':zerion-core-api')

    implementation project(':zerion-core')
    implementation project(':zerion-core-android')
    implementation project(':zerion-app')

    // Embedded I2P router with its bundled crypto relocated into an isolated
    // namespace so it never collides with the app's own Bouncy Castle.
    implementation project(path: ':i2p-embedded', configuration: 'shadow')

    implementation "org.bouncycastle:bcprov-jdk15to18:$bouncy_castle_version"

    // Bitcoin key derivation and transaction signing (BIP32/39/84, P2WPKH).
    // Used only for its crypto/tx primitives; Electrum traffic is routed over
    // Tor by the wallet, not by bitcoinj's own networking. slf4j-api is present
    // with no binding, so bitcoinj's logging is a no-op.
    implementation "org.bitcoinj:bitcoinj-core:0.16.3"

    // newer versions of the libraries below require compileSdk 35
    implementation 'androidx.activity:activity:1.10.1'
    implementation 'androidx.fragment:fragment:1.6.2'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'androidx.exifinterface:exifinterface:1.3.7'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.6.2'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.6.2'

    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.recyclerview:recyclerview-selection:1.1.0'
    implementation 'androidx.biometric:biometric:1.1.0'

    // force kotlin standard lib to latest version to prevent jetifier issues
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:$kotlin_version"
    // JNA runtime for the Payjoin native library UniFFI bindings
    implementation 'net.java.dev.jna:jna:5.14.0@aar'
    implementation "com.squareup.okhttp3:okhttp:$okhttp_version"
    implementation "org.jsoup:jsoup:$jsoup_version"
    implementation 'info.guardianproject.panic:panic:1.0'
    implementation 'uk.co.samuelwall:material-tap-target-prompt:3.3.2'
    implementation 'com.vanniktech:emoji-google:0.9.0' // newer versions are more work to adapt
    def glideVersion = '4.16.0'
    implementation("com.github.bumptech.glide:glide:$glideVersion") {
        exclude group: 'com.android.support'
        exclude module: 'disklrucache' // when there's no disk cache, we can't accidentally use it
    }
    // ExoPlayer for video playback
    def media3Version = '1.4.1'
    implementation "androidx.media3:media3-exoplayer:$media3Version"
    implementation "androidx.media3:media3-ui:$media3Version"

    // QR code generation (ZXing core — no camera UI, just encoding)
    implementation 'com.google.zxing:core:3.5.3'
    implementation 'androidx.camera:camera-camera2:1.4.2'
    implementation 'androidx.camera:camera-lifecycle:1.4.2'
    implementation 'androidx.camera:camera-view:1.4.2'

    annotationProcessor "com.google.dagger:dagger-compiler:$dagger_version"
    annotationProcessor "com.github.bumptech.glide:compiler:$glideVersion"

    compileOnly 'javax.annotation:jsr250-api:1.0'

    testImplementation project(path: ':zerion-core-api', configuration: 'testOutput')
    testImplementation project(path: ':zerion-core', configuration: 'testOutput')

    def espressoVersion = '3.3.0'
    testImplementation 'androidx.test:runner:1.4.0'
    testImplementation 'androidx.test.ext:junit:1.1.5'
    testImplementation "androidx.arch.core:core-testing:2.1.0"
    testImplementation "androidx.test.espresso:espresso-core:3.5.0"
    testImplementation 'org.robolectric:robolectric:4.8.2' // newer versions have SecureRandom issue
    testImplementation 'org.mockito:mockito-core:5.1.1'
    testImplementation 'org.json:json:20180813' // real org.json for plain JVM unit tests (android.jar stub is not mocked)
    testImplementation "junit:junit:$junit_version"
    testImplementation "org.jmock:jmock:$jmock_version"
    testImplementation "org.jmock:jmock-junit4:$jmock_version"
    testImplementation "org.jmock:jmock-imposters:$jmock_version"

    testAnnotationProcessor "com.google.dagger:dagger-compiler:$dagger_version"

    androidTestImplementation project(path: ':zerion-core-api', configuration: 'testOutput')

    androidTestImplementation 'androidx.test.ext:junit:1.1.3'
    androidTestImplementation "androidx.test.espresso:espresso-core:$espressoVersion"
    androidTestImplementation "androidx.test.espresso:espresso-contrib:$espressoVersion"
    androidTestImplementation "androidx.test.espresso:espresso-intents:$espressoVersion"
    androidTestImplementation 'androidx.test:runner:1.3.0'
    androidTestImplementation "junit:junit:$junit_version"

    androidTestAnnotationProcessor "com.google.dagger:dagger-compiler:$dagger_version"

    androidTestCompileOnly 'javax.annotation:jsr250-api:1.0'

    androidTestScreenshotImplementation 'tools.fastlane:screengrab:2.1.1'
    androidTestScreenshotImplementation 'com.jraska:falcon:2.2.0'
    androidTestScreenshotImplementation 'androidx.test.uiautomator:uiautomator:2.2.0'
}

task enforceNoLogs {
    doLast {
        // Dev diagnostics are permitted in DEBUG builds and stripped before release.
        // The zero-log policy is enforced only for release/bundle builds (what ships).
        def requestedTasks = gradle.startParameter.taskNames.join(' ').toLowerCase()
        boolean releaseBuild = requestedTasks.contains('release') ||
                requestedTasks.contains('bundle')
        if (!releaseBuild) {
            println "enforceNoLogs: skipped for debug build (dev diagnostics allowed; enforced on release/bundle)"
            return
        }
        def srcDir = file("src/main/java")
        def banned = ['Log.d(', 'Log.i(', 'Log.w(', 'Log.e(', 'Log.v(',
                       'Log.wtf(', 'Log.println(', 'android.util.Log.println(',
                       'System.out.print', 'System.err.print',
                       '.printStackTrace(', 'Timber.']
        def violations = []
        srcDir.eachFileRecurse(groovy.io.FileType.FILES) { f ->
            if (f.name.endsWith('.java')) {
                f.eachLine { line, num ->
                    banned.each { pattern ->
                        if (line.contains(pattern)) {
                            violations << "${f.path}:${num}: ${line.trim()}"
                        }
                    }
                }
            }
        }
        if (!violations.isEmpty()) {
            throw new GradleException(
                "LOGGING VIOLATION — Zerion enforces zero-log policy:\n"
                + violations.join('\n'))
        }
    }
}

task verifyTranslations {
    doLast {
        def file = project.file("src/main/res/values/arrays.xml")
        def arrays = new XmlParser().parse(file)
        def lc = arrays.children().find { it.@name == "pref_language_values" }
        def translations = []
        lc.children().each { value -> translations.add(value.text()) }

        def folders = ["default", "en-US"]
        def exceptions = ["values-night", "values-v21", "values-v23", "values-v31", "values-ldrtl"]
        project.file("src/main/res").eachDir { dir ->
            if (dir.name.startsWith("values-") &&
                    !exceptions.contains(dir.name)) {
                folders.add(dir.name.substring("values-".length()).replace("-r", "-"))
            }
        }

        folders.each { n ->
            if (!translations.remove(n) && n != 'iw') {
                throw new GradleException("Translation " + n + " is missing in $file")
            }
        }
        if (translations.size() != 0)
            throw new GradleException("Translations\n" + translations.join("\n")
                + "\nhave no matching value folder")

        // Some devices use iw instead of he for hebrew
        def hebrew_legacy = project.file("src/main/res/values-iw")
        def hebrew = project.file("src/main/res/values-he")
        // Copy values-he to values-iw
        if (hebrew.exists()) {
            hebrew_legacy.mkdir()
            copy {
                from hebrew.getAbsolutePath()
                into hebrew_legacy.getAbsolutePath()
            }
        }
    }
}

project.afterEvaluate {
    preBuild.dependsOn.add(verifyTranslations)
    preBuild.dependsOn.add(enforceNoLogs)

    // Wallet-critical logic and crypto must pass before any shippable
    // artifact is produced. A dedicated task runs only the wallet and crypto
    // regression tests (BIP vectors, coin selection, fail-closed behaviour,
    // fee bounds, isolation tags, malformed-response handling, Silent Payments
    // cursor, durable broadcast state, AES-GCM and Argon2id), and release and
    // bundle assembly depend on it.
    def unitTest = tasks.named('testOfficialDebugUnitTest').get()
    tasks.register('walletRegressionTest', Test) {
        group = 'verification'
        description = 'Runs the wallet-logic and crypto regression suite.'
        testClassesDirs = unitTest.testClassesDirs
        classpath = unitTest.classpath
        dependsOn 'compileOfficialDebugUnitTestJavaWithJavac'
        useJUnit()
        filter {
            includeTestsMatching 'com.professor.zerion.android.vault.wallet.btc.*'
            includeTestsMatching 'com.professor.zerion.android.vault.crypto.*'
        }
    }
    tasks.matching {
        (it.name.startsWith('assemble') || it.name.startsWith('bundle')) &&
                it.name.toLowerCase().contains('release')
    }.configureEach {
        it.dependsOn('walletRegressionTest')
    }

    // Disable ART/Baseline profile tasks for F-Droid reproducible builds
    if (isFdroidBuild) {
        tasks.matching { it.name.toLowerCase().contains("artprofile") }.configureEach { it.enabled = false }
        tasks.matching { it.name.toLowerCase().contains("baselineprofile") }.configureEach { it.enabled = false }
    }
}

apply from: "${projectDir}/native/payjoin/verify-payjoin-native.gradle"
