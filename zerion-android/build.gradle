apply plugin: 'com.android.application'

rootProject.ext.payjoinNativeEnabled = false
if (rootProject.ext.payjoinNativeEnabled) {
    apply plugin: 'kotlin-android'
}

def fdroidProperty = project.findProperty('fdroid')
if (fdroidProperty == null || fdroidProperty.toString().equalsIgnoreCase('false')) {
    throw new GradleException('This project builds in reproducible mode only: gradle.properties sets fdroid=true and -Pfdroid=false is not supported')
}
def isFdroidBuild = true

android {
    compileSdk 36
    buildToolsVersion '36.0.0'
    ndkVersion '27.1.12297006'
    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }
    packaging {
        jniLibs {
            useLegacyPackaging = true
            keepDebugSymbols += ['**/*.so']
            if (!rootProject.ext.payjoinNativeEnabled) {
                excludes += ['**/libpayjoin_ffi.so']
            }
        }
        resources {
            excludes += ["META-INF/version-control-info.textproto"]
        }
        if (isFdroidBuild) {
            resources {
                excludes += [
                    "assets/dexopt/baseline.prof",
                    "assets/dexopt/baseline.profm"
                ]
            }
        }
    }

    buildFeatures {
        buildConfig = true
    }

    dependenciesInfo {
        includeInApk = false
        includeInBundle = false
    }

    defaultConfig {
        minSdkVersion 29
        targetSdkVersion 36
        versionCode 31800
        versionName "3.0.18"
        applicationId "com.professor.zerion"
        buildConfigField "String", "TorVersion", "\"$tor_version\""
        buildConfigField "String", "UPDATE_MANIFEST_URL", "\"https://raw.githubusercontent.com/zerionproject/Zerion/master/docs/release-manifest.json\""
        buildConfigField "String", "UPDATE_RELEASES_URL", "\"https://github.com/zerionproject/Zerion/releases\""

        vectorDrawables.useSupportLibrary = true

        testInstrumentationRunner 'com.professor.zerion.android.BriarTestRunner'
        testInstrumentationRunnerArguments disableAnalytics: 'true'
        multiDexEnabled true
        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=none'
                abiFilters 'arm64-v8a', 'armeabi-v7a'
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            shrinkResources false
            minifyEnabled false
            crunchPngs false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.txt'
            testProguardFiles getDefaultProguardFile('proguard-android.txt'),
                    'proguard-rules.txt', 'proguard-test.txt'
        }
        release {
            shrinkResources true
            minifyEnabled true
            crunchPngs false
            vcsInfo {
                include false
            }
            ndk {
                abiFilters 'arm64-v8a', 'armeabi-v7a'
            }
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.txt'
        }
    }

    flavorDimensions "version"
    productFlavors {
        screenshot {
            dimension "version"
            applicationIdSuffix ".screenshot"
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.txt', 'proguard-test.txt'
        }
        official {
            dimension "version"
        }
    }

    variantFilter { variant ->
        if (variant.flavors*.name.contains("screenshot") && variant.buildType.name == "release") {
            setIgnore(true)
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    if (rootProject.ext.payjoinNativeEnabled) {
        kotlinOptions {
            jvmTarget = '17'
        }
    }

    sourceSets {
        if (rootProject.ext.payjoinNativeEnabled) {
            main.kotlin.srcDirs += "$projectDir/native/payjoin/bindings"
        }
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
            all {
                it.systemProperty 'net.bytebuddy.experimental', 'true'
                it.jvmArgs '--add-opens=java.base/javax.crypto=ALL-UNNAMED'
                it.maxHeapSize = '2g'
            }
        }
    }
    namespace 'com.professor.zerion'
    lint {
        abortOnError true
        checkReleaseBuilds false
        warning 'MissingTranslation', 'MissingDefaultResource', 'ImpliedQuantity', 'ExtraTranslation', 'InvalidPackage', 'MissingPermission'
    }

    applicationVariants.all { variant ->
        variant.outputs.all {
            def appName = "zerion"
            def buildType = variant.buildType.name
            def flavorName = variant.flavorName
            outputFileName = "${appName}-${flavorName}-${buildType}.apk"
        }
    }
}

if (isFdroidBuild) {
    configurations.all {
        exclude group: 'androidx.profileinstaller', module: 'profileinstaller'
    }
}

configurations.all {
    resolutionStrategy {
        force 'org.slf4j:slf4j-api:1.7.32'
    }
    exclude group: 'org.bouncycastle', module: 'bcprov-jdk15on'
}

configurations.configureEach { config ->
    if (config.name.toLowerCase().contains('unittest')) {
        config.resolutionStrategy {
            force 'org.ow2.asm:asm:9.6'
            force 'org.ow2.asm:asm-commons:9.6'
            force 'org.ow2.asm:asm-tree:9.6'
            force 'org.ow2.asm:asm-util:9.6'
            force 'org.ow2.asm:asm-analysis:9.6'
        }
    }
}


